name: Simple Snapshot Audit
description: Warn when snapshot files change without a paired test file change.
author: Dmytro Paduchak
branding:
  icon: camera
  color: yellow
inputs:
  github-token:
    description: Token to read PR/repo data and post sticky comments.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "none = report only; medium or high = fail when findings match."
    required: false
    default: none
runs:
  using: node20
  main: dist/index.js
